<!doctype html><html><head><title>JS test</title>
<style>.box{background:#def;padding:6px;margin:4px} .hot{color:#c00;font-weight:bold}</style></head>
<body><h1 id="t">Titulo</h1><div id="out"></div><ul id="list"></ul>
<script>
var out = document.getElementById('out');
out.innerHTML = '<p class="box">Hola desde <b>JS</b></p>';
document.getElementById('t').textContent = 'Titulo cambiado por JS';
for (var i=1;i<=3;i++){ var li=document.createElement('li'); li.textContent='item '+i; li.className = i==2?'hot':''; document.getElementById('list').appendChild(li); }
var d=document.createElement('div'); d.className='box'; d.id='later'; d.textContent='esperando timer...'; document.body.appendChild(d);
setTimeout(function(){ d.textContent='timer ok '+ (typeof URL) + ' ' + new URL('../x?a=1','http://h.com/a/b/c').href; d.style.color='#080'; },100);
document.addEventListener('DOMContentLoaded', function(){ var e=document.createElement('div'); e.className='box'; e.textContent='DOMContentLoaded ok, readyState='+document.readyState; document.body.appendChild(e); });
window.addEventListener('load', function(){ var e=document.createElement('div'); e.className='box'; e.textContent='load ok; qsa=' + document.querySelectorAll('.box').length + ' json=' + JSON.stringify({a:[1,2]}); document.body.appendChild(e); });
Promise.resolve(5).then(function(v){ var e=document.createElement('div'); e.className='box hot'; e.textContent='promesa '+v+' '+btoa('hola')+' '+localStorage.getItem('x'); document.body.appendChild(e); });
</script>
<script>
fetch('js1b.json').then(r=>r.json()).then(j=>{ var e=document.createElement('div'); e.className='box'; e.textContent='fetch: '+j.msg; document.body.appendChild(e); });
try { nope(); } catch(e) { var z=document.createElement('div'); z.textContent='catch ok: '+e.name; document.body.appendChild(z); }
</script>
</body></html>
